<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#13294B" />
      <stop offset="65%" stop-color="#091322" />
      <stop offset="100%" stop-color="#04080F" />
    </radialGradient>

    
    <linearGradient id="silverMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#DCE8F5" />
      <stop offset="100%" stop-color="#89A8C9" />
    </linearGradient>

    
    <linearGradient id="ringBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5D8FF" />
      <stop offset="50%" stop-color="#4A90E2" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <circle cx="32" cy="32" r="31" fill="url(#bgGlow)" />

  
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="url(#ringBlue)" stroke-width="2" filter="url(#softGlow)" />
  <circle cx="32" cy="32" r="24.2" fill="none" stroke="#60A5FA" stroke-opacity="0.35" stroke-width="0.9" />

  
  <g fill="#E0F2FE" filter="url(#softGlow)">
    <circle cx="32" cy="3.5" r="1.7" />
    <circle cx="60.5" cy="32" r="1.7" />
    <circle cx="32" cy="60.5" r="1.7" />
    <circle cx="3.5" cy="32" r="1.7" />
  </g>

  
  <g transform="translate(1.5, 0.75)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <path d="M 14.5 44 L 26.5 17.5 L 32.5 44" stroke="url(#silverMetal)" stroke-width="3.8" />
    
    
    <path d="M 47.5 21.5 C 46.5 17.2, 37.5 16.5, 34.5 21.5 C 32.5 25, 36 28.5, 41 31 C 46.5 33.5, 49.5 37.5, 46.5 42 C 43.5 46, 35.5 45.5, 33 41" stroke="url(#silverMetal)" stroke-width="3.8" />

    
    <path d="M 12.5 39 C 16 33.5, 25 32.5, 34.5 29.5" stroke="#091322" stroke-width="5.6" />
    <path d="M 12.5 39 C 16 33.5, 25 32.5, 34.5 29.5" stroke="url(#silverMetal)" stroke-width="3.2" />
  </g>
</svg>
